<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Euro Club Cup Sim 2026/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --sunk:#E3E9E5; --ink:#14213D; --muted:#5A6577; --line:#D3DCD6;
  --pitch:#1F7A4D; --pitch-ink:#FFFFFF; --gold:#A87F12; --gold-tint:#E9C34A; --amber:#C07613; --red:#B23A3A;
  --zone-top:#1F7A4D; --zone-po:#C9A13B; --zone-out:#A9B3AE;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613; --surface:#15201B; --sunk:#1B2822; --ink:#E4ECE7; --muted:#93A39B; --line:#26352E;
    --pitch:#4DBB82; --pitch-ink:#0B1410; --gold:#E2BC4A; --gold-tint:#E2BC4A; --amber:#E0A04A; --red:#E07272;
    --zone-top:#4DBB82; --zone-po:#D6B04E; --zone-out:#4A5852;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#15201B; --sunk:#1B2822; --ink:#E4ECE7; --muted:#93A39B; --line:#26352E;
  --pitch:#4DBB82; --pitch-ink:#0B1410; --gold:#E2BC4A; --gold-tint:#E2BC4A; --amber:#E0A04A; --red:#E07272;
  --zone-top:#4DBB82; --zone-po:#D6B04E; --zone-out:#4A5852;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font:16px/1.5 Barlow, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; -webkit-text-size-adjust:100%}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg)}
button,select,input,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--pitch); outline-offset:2px}
.wrap{max-width:1120px; margin:0 auto; padding:0 16px}
.cond{font-family:"Barlow Condensed", "Arial Narrow", Barlow, sans-serif}

header.top{padding:22px 0 10px}
header.top h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:clamp(30px,6vw,46px); line-height:1; margin:0; letter-spacing:-.01em}
header.top h1 small{font-weight:500; color:var(--muted); font-size:.55em; margin-left:.35em; letter-spacing:0}
.status{color:var(--muted); margin:6px 0 0; font-size:15px; min-height:1.5em}
.progress{height:3px; background:var(--sunk); border-radius:2px; overflow:hidden; margin-top:10px}
.progress i{display:block; height:100%; width:0; background:var(--pitch); transition:width .15s linear}

nav.tabs{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding:8px 0; border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
.tab{border:0; background:none; padding:8px 14px; border-radius:999px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink); color:var(--bg)}

main{padding:18px 0 48px}
.view[hidden]{display:none}
h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:600; font-size:26px; line-height:1.15; margin:0 0 4px}
.lede{color:var(--muted); margin:0 0 14px; max-width:68ch}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 12px}
.chip{white-space:nowrap; flex:none; border:1px solid var(--line); background:var(--surface); padding:5px 12px; border-radius:999px; cursor:pointer; font-size:14px; font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--ink); background:var(--ink); color:var(--bg)}
.btn{border:0; background:var(--pitch); color:var(--pitch-ink); padding:10px 18px; border-radius:10px; font-weight:600; cursor:pointer}
.btn.ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line)}
.btn:disabled{opacity:.5; cursor:default}

/* favourites strip */
.favs{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:0 0 18px}
.fav{background:var(--surface); border-radius:12px; padding:12px 14px; border-left:4px solid var(--c)}
.fav b{display:block; font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-size:32px; line-height:1; font-weight:700}
.fav span{color:var(--muted); font-size:14px}

/* tables */
.scroll{overflow-x:auto; background:var(--surface); border-radius:12px; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums}
th,td{padding:8px 10px; text-align:right; white-space:nowrap}
th{font-weight:600; color:var(--muted); font-size:13px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface)}
td{border-bottom:1px solid var(--line); font-size:15px}
tr:last-child td{border-bottom:0}
th.l,td.l{text-align:left}
td.team, th.team{position:sticky; left:0; background:var(--surface); z-index:1; text-align:left}
th.team{z-index:2}
.tn{display:inline-flex; align-items:center; gap:8px; font-weight:600}
.dot{width:10px; height:10px; border-radius:3px; background:var(--c); flex:none}
.pos{color:var(--muted); width:2.2em; display:inline-block}
td.heat{background:color-mix(in srgb, var(--pitch) calc(var(--p) * 0.62%), transparent)}
td.heat.win{background:color-mix(in srgb, var(--gold-tint) calc(var(--p) * 1.6%), transparent); font-weight:600}
td.faint{color:var(--muted)}
.zone td.team{box-shadow:inset 4px 0 0 var(--z)}
.full-only{display:none}
@media (min-width:760px){ .full-only{display:table-cell} }
.pill{display:inline-block; width:20px; height:20px; line-height:20px; text-align:center; border-radius:5px; font-size:12px; font-weight:600; margin-left:2px; color:#fff}
.pill.W{background:#2E8B57} .pill.D{background:#8A949B} .pill.L{background:#B5473F}
.legend{display:flex; gap:16px; flex-wrap:wrap; color:var(--muted); font-size:14px; margin:10px 2px 0}
.legend i{display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; background:var(--z)}

/* fixtures */
.mds{display:flex; gap:4px; overflow-x:auto; margin:0 0 12px; scrollbar-width:none}
.mds::-webkit-scrollbar{display:none}
.mds .chip{min-width:44px; text-align:center}
.matches{display:grid; gap:8px; grid-template-columns:1fr}
@media (min-width:760px){ .matches{grid-template-columns:1fr 1fr} }
.match{background:var(--surface); border-radius:12px; padding:10px 12px; display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center}
.match .h{justify-self:end; text-align:right} .match .a{justify-self:start}
.match .tn{font-weight:600}
.score{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-size:24px; font-weight:700; min-width:64px; text-align:center}
.odds{grid-column:1/-1; display:flex; height:22px; border-radius:6px; overflow:hidden; font-size:12px; font-weight:600}
.odds span{display:flex; align-items:center; justify-content:center; min-width:0; overflow:hidden}
.odds .oh{background:var(--pitch); color:var(--pitch-ink)} .odds .od{background:var(--sunk); color:var(--muted)} .odds .oa{background:var(--ink); color:var(--bg)}
.likely{grid-column:1/-1; color:var(--muted); font-size:13px; text-align:center; margin-top:-4px}

/* bracket */
.rounds-tabs{display:flex; gap:4px; overflow-x:auto; margin-bottom:12px}
.bracket{display:block}
.round{display:none}
.round.on{display:grid; gap:8px}
@media (min-width:1000px){
  .rounds-tabs{display:none}
  .bracket{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:12px; align-items:start}
  .round{display:grid !important; gap:8px; align-content:space-around; min-height:100%}
  .round h3{display:block}
}
.round h3{display:none; font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-size:18px; font-weight:600; margin:0 0 2px; color:var(--muted)}
.tie{background:var(--surface); border-radius:10px; padding:8px 10px; font-size:14px}
.tie .ln{display:flex; justify-content:space-between; gap:8px; align-items:center}
.tie .ln.w{font-weight:700}
.tie .ln.lose{color:var(--muted)}
.tie .note{color:var(--muted); font-size:12px}
.champion{background:var(--surface); border-radius:12px; padding:16px; margin:0 0 16px; border-left:6px solid var(--c); display:flex; gap:14px; align-items:baseline; flex-wrap:wrap}
.champion b{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-size:36px; line-height:1}
.champion span{color:var(--muted)}
.empty{background:var(--surface); border-radius:12px; padding:28px 20px; text-align:center}
.empty p{color:var(--muted); margin:0 0 14px}

/* update */
.panel{background:var(--surface); border-radius:12px; padding:16px; margin:0 0 16px}
.panel h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-size:21px; font-weight:600; margin:0 0 4px}
.panel p.help{color:var(--muted); margin:0 0 12px; font-size:15px; max-width:68ch}
textarea{width:100%; min-height:140px; border:1px solid var(--line); border-radius:10px; background:var(--bg); padding:10px; resize:vertical; font-size:15px}
.preview{list-style:none; padding:0; margin:12px 0; display:grid; gap:4px; font-size:14px}
.preview li{padding:6px 10px; border-radius:8px; background:var(--bg)}
.preview li.bad{color:var(--red)}
.preview li .md{color:var(--muted); margin-right:6px}
.forms{display:grid; gap:6px; grid-template-columns:1fr}
@media (min-width:860px){ .forms{grid-template-columns:1fr 1fr} }
.frow{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:4px 0; border-bottom:1px solid var(--line)}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; flex:none}
.seg button{border:0; background:none; padding:5px 8px; font-size:13px; cursor:pointer; color:var(--muted); min-width:44px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg); font-weight:600}
.sl{display:grid; grid-template-columns:1fr; gap:4px; margin:0 0 14px}
.sl label{display:flex; justify-content:space-between; font-weight:500}
.sl label output{color:var(--muted); font-variant-numeric:tabular-nums}
.sl small{color:var(--muted)}
input[type=range]{width:100%; accent-color:var(--pitch)}
select{border:1px solid var(--line); border-radius:8px; background:var(--bg); padding:6px 10px}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-weight:500; z-index:20; max-width:90vw}
details.how{background:var(--surface); border-radius:12px; padding:12px 16px; margin-top:16px}
details.how summary{cursor:pointer; font-weight:600}
details.how p{color:var(--muted); max-width:70ch; margin:8px 0 0}
.strength{color:var(--muted); font-size:13px}

/* bets */
.betgrid{display:grid; gap:16px; grid-template-columns:1fr}
@media (min-width:960px){ .betgrid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); align-items:start} .slip{position:sticky; top:72px} }
.mkt td, .mkt th{padding:7px 8px}
.mkt td.l{white-space:normal; min-width:150px}
.mkt .grp td{background:var(--sunk); color:var(--muted); font-weight:600; font-size:13px; text-align:left}
.mkt input{width:76px; border:1px solid var(--line); border-radius:8px; background:var(--bg); padding:5px 8px; text-align:right; font-variant-numeric:tabular-nums}
.edge-pos{color:var(--pitch); font-weight:700}
.edge-neg{color:var(--muted)}
.add{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:4px 10px; cursor:pointer; font-weight:600; font-size:13px}
.add[aria-pressed="true"]{background:var(--pitch); color:var(--pitch-ink); border-color:var(--pitch)}
.slip .leg{display:flex; justify-content:space-between; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px}
.slip .leg small{display:block; color:var(--muted)}
.slip .x{border:0; background:none; color:var(--muted); cursor:pointer; font-size:18px; padding:2px 6px}
.kv{display:flex; justify-content:space-between; padding:4px 0; font-variant-numeric:tabular-nums}
.kv b{font-weight:700}
.warn{color:var(--amber); font-size:13px; margin:6px 0 0}
.ideas{display:grid; gap:10px; grid-template-columns:1fr}
@media (min-width:760px){ .ideas{grid-template-columns:1fr 1fr} }
.idea{background:var(--surface); border-radius:12px; padding:12px 14px; display:flex; justify-content:space-between; gap:10px; align-items:center}
.idea .what{font-weight:600}
.idea .meta{color:var(--muted); font-size:13px}
.idea .num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
.idea .num b{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-size:22px; display:block; line-height:1}
.multi{background:var(--surface); border-radius:12px; padding:14px; border-left:4px solid var(--gold)}
.multi ul{margin:6px 0 10px; padding-left:18px}
.footnote{color:var(--muted); font-size:13px; margin-top:18px; max-width:70ch}
h3.sec{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-size:21px; font-weight:600; margin:20px 0 8px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>

function parseResults(text, results) {
  const out = [];
  for (const raw of text.split(/\r?\n/)) {
    let line = raw.trim();
    if (!line) continue;
    let xg = null;
    const xm = line.match(/\s*(?:\(\s*(?:xg:?\s*)?(\d+(?:\.\d+)?)\s*[-–:]\s*(\d+(?:\.\d+)?)\s*\)|xg:?\s*(\d+(?:\.\d+)?)\s*[-–:]\s*(\d+(?:\.\d+)?))\s*$/i);
    if (xm) { xg = [+(xm[1] ?? xm[3]), +(xm[2] ?? xm[4])]; line = line.slice(0, xm.index).trim(); }
    const m = line.match(/^(.+?)\s+(\d{1,2})\s*[-–—:]\s*(\d{1,2})\s+(.+?)$/);
    if (!m) { out.push({line: raw.trim(), ok:false, why:'No score found. Use the form "Liverpool 2-1 Villarreal".'}); continue; }
    const h = findTeam(m[1]), a = findTeam(m[4]);
    if (!h || !a) { out.push({line, ok:false, why:`Team not recognised: ${!h ? m[1] : m[4]}`}); continue; }
    const f = FIX.find(x => x.h === h && x.a === a);
    if (!f) {
      const rev = FIX.find(x => x.h === a && x.a === h);
      out.push({line, ok:false, why: rev ? `In the fixture list this is ${TEAM[a].name} at home. Check the order.` : 'These teams do not play each other.'});
      continue;
    }
    const prev = results[f.k];
    out.push({line: raw.trim(), ok:true, f, hg:+m[2], ag:+m[3], prev, xg});
  }
  return out;
}

// Parse a copied xG table: club name followed by played, xG, xGA (signed +/- differences are skipped).
function parseXgTable(text) {
  const toks = text.replace(/\u2212/g, '-').split(/[\s|,;\t]+/).filter(Boolean);
  const found = [];
  for (let i = 0; i < toks.length; i++) {
    for (let len = 4; len >= 1; len--) {
      if (i + len > toks.length) continue;
      const id = findTeam(toks.slice(i, i + len).join(' '));
      if (id) { found.push({id, at: i, end: i + len}); i += len - 1; break; }
    }
  }
  const out = [], seen = new Set();
  found.forEach((x, j) => {
    const stop = j + 1 < found.length ? found[j + 1].at : toks.length;
    const nums = toks.slice(x.end, stop).filter(t => /^\d+(\.\d+)?$/.test(t)).map(Number);
    const [pl, xg, xga] = nums;
    if (seen.has(x.id)) return;
    if (Number.isInteger(pl) && pl > 0 && pl <= 8 && xg >= 0 && xga >= 0 && nums.length >= 3) { out.push({id: x.id, pl, xg, xga}); seen.add(x.id); }
  });
  return out;
}

const G0 = 2.95;         // long-run average goals per game in this competition

const STYLE_GOALS = {pos:1, press:1.05, counter:1, block:0.92};
let STYLES = {...DEFAULT_STYLES};
function styleEdge(h, a) {

function computeStrengths(st, set) {

    if (!games || mine.length < games) continue;

  for (const t of TEAMS) { act[t.id] = exp[t.id] = gf[t.id] = ga[t.id] = xgf[t.id] = xga[t.id] = 0; }
  for (const f of played) {
    const [hg, ag] = eff[f.k];
    const [lh, la] = lambdas(s[f.h], s[f.a], false, set);
    exp[f.h] += lh + la; exp[f.a] += lh + la;
    xgf[f.h] += lh; xga[f.h] += la; xgf[f.a] += la; xga[f.a] += lh;

function matchProbs(sh, sa, set, mult = 1) {
  const [lh, la] = lambdas(sh, sa, false, set, mult);

    if (p > bp) { bp = p; best = [i, j]; }

  const g = set.learnG ? (goals + LB.g0 * G_PRIOR) / (results.length + G_PRIOR) : LB.g0;
  const gp = 100 / (g * C);
  const lamb = (sh, sa, mult = 1) => { const d = sh - sa + set.hfa; return [g / 2 * mult * Math.exp(C * d / 100), g / 2 * mult * Math.exp(-C * d / 100)]; };
  const s = {}; teams.forEach(t => s[t] = base(t));
  for (let it = 0; it < 4; it++) {
    const sum = {}, n = {}; teams.forEach(t => { sum[t] = 0; n[t] = 0; });
    for (const [, h, a, hg, ag] of results) {
      const [lh1, la1] = lamb(base(h), s[a]), [lh2, la2] = lamb(s[h], base(a));
      sum[h] += clamp((hg - ag) - (lh1 - la1), -3, 3); n[h]++;
      sum[a] += clamp((ag - hg) - (la2 - lh2), -3, 3); n[a]++;
    }
    teams.forEach(t => { const k = n[t]; s[t] = base(t) + (k ? clamp(k / (k + SHRINK) * (sum[t] / k) * gp, -160, 160) : 0); });
  }
  const act = {}, ex = {}; teams.forEach(t => { act[t] = 0; ex[t] = 0; });
  for (const [, h, a, hg, ag] of results) { const [lh, la] = lamb(s[h], s[a]); act[h] += hg + ag; act[a] += hg + ag; ex[h] += lh + la; ex[a] += lh + la; }
  const tempo = {}; teams.forEach(t => tempo[t] = clamp(Math.pow((act[t] + TEMPO_PRIOR) / (ex[t] + TEMPO_PRIOR), set.tempoW ?? 0.3), 0.75, 1.35));
  return {
    g, rating: id => s[id] ?? base(id),
    lambdas: (h, a) => lamb(s[h] ?? base(h), s[a] ?? base(a), Math.sqrt((tempo[h] || 1) * (tempo[a] || 1))),
  };
}

// ---------- Season simulation ----------
function play(ns, h, a, neutral, set) { const [lh, la] = teamLambdas(ns, h, a, neutral, set); return [pois(lh), pois(la)]; }
function shuffle2(a) { return Math.random() < 0.5 ? a : [a[1], a[0]]; }

// Two legs: `first` hosts leg 1, `second` hosts leg 2 (and extra time).
function twoLeg(ns, first, second, set) {
  const [a1, b1] = play(ns, first, second, false, set);
  const [b2, a2] = play(ns, second, first, false, set);
  let fa = a1 + a2, sa = b1 + b2, et = false, pens = null;
  if (fa === sa) {
    et = true;
    const [lh, la] = teamLambdas(ns, second, first, false, set);
    const e2 = pois(lh / 3), e1 = pois(la / 3); sa += e2; fa += e1;
    if (fa === sa) pens = Math.random() < 0.5 ? first : second;
  }
  const w = pens || (fa > sa ? first : second);
  return {first, second, fa, sa, et, pens, w, legs:[[a1, b1], [b2, a2]]};
}
function single(ns, x, y, set) {
  let [gx, gy] = play(ns, x, y, true, set), et = false, pens = null;
  if (gx === gy) {
    et = true;
    const [lx, ly] = teamLambdas(ns, x, y, true, set);
    gx += pois(lx / 3); gy += pois(ly / 3);
    if (gx === gy) pens = Math.random() < 0.5 ? x : y;
  }
  return {first:x, second:y, fa:gx, sa:gy, et, pens, w: pens || (gx > gy ? x : y)};
}

function simSeason(S, baseTab, unplayed, set, detail) {
  const ns = {}; for (const t of TEAMS) ns[t.id] = S[t.id] + gauss() * set.noise;
  const tab = {}; for (const id in baseTab) { const r = baseTab[id]; tab[id] = {...r, form: detail ? [...r.form] : r.form}; }
  let rested = null;
  for (const f of unplayed) {
    if (f.md === 8 && rested === null) {
      rested = set.rot > 0 ? lockedTeams(tab) : [];
      for (const id of rested) ns[id] -= set.rot;
    }
    const [hg, ag] = play(ns, f.h, f.a, false, set);
    if (detail) addResult(tab, f.h, f.a, hg, ag);
    else {
      const H = tab[f.h], A = tab[f.a]; H.gf += hg; H.ga += ag; A.gf += ag; A.ga += hg; A.agf += ag;
      if (hg > ag) { H.w++; H.pts += 3; } else if (hg < ag) { A.w++; A.aw++; A.pts += 3; } else { H.pts++; A.pts++; }
    }
  }
  const rows = rankTable(tab, true);
  if (rested) for (const id of rested) ns[id] += set.rot;   // rotation only lasts for matchday 8
  if (set.koW > 0) for (const id in PEDIGREE) ns[id] += PEDIGREE[id] * PED_PTS * set.koW;
  const R = k => rows[k - 1].id;            // team at rank k
  // Knockout play-offs (9-24). Seeded side hosts the second leg.
  const groups = [[[9,10],[23,24]], [[11,12],[21,22]], [[13,14],[19,20]], [[15,16],[17,18]]];
  const poTies = [], poWinners = [];
  for (const [[s1, s2], unseeded] of groups) {
    const [u1, u2] = shuffle2(unseeded);
    const t1 = twoLeg(ns, R(u1), R(s1), set), t2 = twoLeg(ns, R(u2), R(s2), set);
    poTies.push(t1, t2); poWinners.push([t1.w, t2.w]);
  }
  // Round of 16: seeds 7/8 meet the 9/10 group winners, 5/6 the 11/12 group, 3/4 the 13/14 group, 1/2 the 15/16 group.
  const seedPairs = [[7,8],[5,6],[3,4],[1,2]];
  const halfA = {}, halfB = {};
  const r16 = [];
  seedPairs.forEach(([x, y], g) => {
    const [sa, sb] = shuffle2([R(x), R(y)]);
    const [wa, wb] = shuffle2(poWinners[g]);
    const ta = twoLeg(ns, wa, sa, set), tb = twoLeg(ns, wb, sb, set);
    r16.push(ta, tb); halfA[g] = ta.w; halfB[g] = tb.w;
  });
  // Quarter-finals: (1/2 path v 7/8 path) and (3/4 path v 5/6 path), in each half. Draw decides home order.
  const qf = [], sfIn = [];
  for (const half of [halfA, halfB]) {
    const pair = [];
    for (const [g1, g2] of [[3, 0], [2, 1]]) {
      const [x, y] = shuffle2([half[g1], half[g2]]);
      const t = twoLeg(ns, x, y, set); qf.push(t); pair.push(t.w);
    }
    sfIn.push(pair);
  }
  const sf = sfIn.map(p => { const [x, y] = shuffle2(p); return twoLeg(ns, x, y, set); });
  const fin = single(ns, sf[0].w, sf[1].w, set);
  return {rows, poTies, r16, qf, sf, fin, rested: rested || []};
}

// Before the last matchday (one game, max 3 points left): clubs whose zone can no longer change.
// Sure of the top 8, or already out of 25-36. Ties are treated as risky, so the check is cautious.
function lockedTeams(tab) {
  const rows = Object.values(tab), out = [];
  for (const r of rows) {
    const others = rows.filter(o => o !== r);
    const canCatch = others.filter(o => o.pts + 3 >= r.pts).length;   // could finish level or above
    const surelyAbove = others.filter(o => o.pts > r.pts + 3).length;  // stay above even if r wins
    if (canCatch <= 7 || surelyAbove >= 24) out.push(r.id);
  }
  return out;
}

// Furthest stage per club in one simulated season: 0 out in league, 1 lost play-off, 2 R16, 3 QF, 4 SF, 5 final, 6 won.
function stagesOf(res) {
  const st = {}; res.rows.forEach((r, i) => st[r.id] = 0);
  for (const t of res.poTies) { st[t.first] = Math.max(st[t.first], 1); st[t.second] = Math.max(st[t.second], 1); }
  for (const t of res.r16) { st[t.first] = Math.max(st[t.first], 2); st[t.second] = Math.max(st[t.second], 2); }
  for (const t of res.qf) { st[t.first] = 3; st[t.second] = 3; }
  for (const t of res.sf) { st[t.first] = 4; st[t.second] = 4; }
  st[res.fin.first] = 5; st[res.fin.second] = 5; st[res.fin.w] = 6;
  return st;
}
function newCounts() {
  const c = {}; for (const t of TEAMS) c[t.id] = {top8:0, po:0, out:0, r16:0, qf:0, sf:0, fin:0, win:0, pts:0, pos:0};
  return c;
}
function tally(c, res) {
  res.rows.forEach((r, i) => {
    const x = c[r.id]; x.pts += r.pts; x.pos += i + 1;
    if (i < 8) x.top8++; else if (i < 24) x.po++; else x.out++;
  });
  for (const t of res.r16) { c[t.first].r16++; c[t.second].r16++; }
  for (const t of res.qf) { c[t.first].qf++; c[t.second].qf++; }
  for (const t of res.sf) { c[t.first].sf++; c[t.second].sf++; }
  c[res.fin.first].fin++; c[res.fin.second].fin++; c[res.fin.w].win++;
}

if (typeof module !== 'undefined' && module.exports) module.exports = {TEAMS, TEAM, FIX, parseResults, computeStrengths, matchProbs, buildTable, rankTable, simSeason, newCounts, tally, DEFAULT_SET, lambdas, parseXgTable, currentG, PEDIGREE, lockedTeams, teamLambdas, tempoOf, stagesOf, styleEdge, STYLE_NAMES, DEFAULT_STYLES};

</script>
<script>
// Capture the untouched page first, so saved updates can be written back into it.
const TEMPLATE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const LS_STATE = 'eccs-state-v1', LS_SET = 'eccs-settings-v1';
const $ = s => document.querySelector(s);
const pct = (x, n) => n ? x / n * 100 : 0;
const fmt = p => p >= 99.5 ? '>99' : p > 0 && p < 0.5 ? '<1' : Math.round(p).toString();
const teamCell = id => `<span class="tn" style="--c:${TEAM[id].color}"><i class="dot"></i>${TEAM[id].name}</span>`;
const teamShort = id => `<span class="tn" style="--c:${TEAM[id].color}"><i class="dot"></i>${TEAM[id].short}</span>`;
const FORM_LABELS = [['-2','Poor'],['-1','Below'],['0','Normal'],['1','Good'],['2','Hot']];

let embedded = {results:{}, form:{}, updated:''};
try { embedded = JSON.parse(document.getElementById('saved-state').textContent); } catch (e) {}
let state = embedded;
try {
  const local = JSON.parse(localStorage.getItem(LS_STATE) || 'null');
  if (local && local.updated && local.updated > (embedded.updated || '')) state = local;
} catch (e) {}
let settings = {...DEFAULT_SET};
try {
  const saved = JSON.parse(localStorage.getItem(LS_SET) || '{}');
  if ((saved.v || 1) < 2) { delete saved.tempoW; saved.v = 2; }   // backtest update: new goal-pattern default
  Object.assign(settings, saved);
} catch (e) {}

let saveMode = 'local';      // 'shared' when the owner can republish this page
let artifactApi = null;
const IDX = Object.fromEntries(TEAMS.map((t, i) => [t.id, i]));
let SIMPOS = null, SIMSTG = null;   // per simulated season: each club's league finish and furthest stage
let counts = null, simsDone = 0, runId = 0, strengths = null, lastSeason = null;
let xgDraft = null;
let importDraft = null, downloadsApi = null;
let oddsSort = 'win', fixMd = null, roundTab = 0, pending = null, formDraft = null;

// ---------- helpers ----------
function playedCount() { return FIX.filter(f => state.results[f.k]).length; }
function lastCompleteMd() {
  let md = 0;
  for (let m = 1; m <= 8; m++) if (FIX.filter(f => f.md === m).every(f => state.results[f.k])) md = m; else break;
  return md;
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
function setStatus(extra) {
  const md = lastCompleteMd(), n = playedCount();
  const where = n === 0 ? 'Before matchday 1' : md === 8 ? 'League phase complete' :
    `After matchday ${md} of 8` + (n > md * 18 ? ` (plus ${n - md * 18} matchday ${md + 1} results)` : '');
  $('#status').textContent = `${where}. ${extra || ''}`;
}

// ---------- simulation runner ----------
function runSims() {
  const my = ++runId;
  strengths = computeStrengths(state, settings).s;
  const baseTab = buildTable(state.results);
  const unplayed = FIX.filter(f => !state.results[f.k]);
  const N = settings.sims;
  counts = newCounts(); simsDone = 0;
  SIMPOS = new Uint8Array(N * 36); SIMSTG = new Uint8Array(N * 36);
  const step = () => {
    if (my !== runId) return;
    const end = Math.min(N, simsDone + 400);
    for (; simsDone < end; simsDone++) {
      const res = simSeason(strengths, baseTab, unplayed, settings, false);
      tally(counts, res);
      const o = simsDone * 36, stg = stagesOf(res);
      res.rows.forEach((r, i) => { SIMPOS[o + IDX[r.id]] = i + 1; SIMSTG[o + IDX[r.id]] = stg[r.id]; });
    }
    $('#bar').style.width = (simsDone / N * 100) + '%';
    if (simsDone < N) { setStatus(`Simulating ${simsDone.toLocaleString()} of ${N.toLocaleString()} seasons…`); setTimeout(step, 0); }
    else { setStatus(`${N.toLocaleString()} simulated seasons.`); setTimeout(() => $('#bar').style.width = '0', 600); renderOdds(); renderFixtures(); renderTable(); if (!$('#v-ideas').hidden) renderIdeas(); if (!$('#v-check').hidden) renderCheck(); }
  };
  renderFixtures();
  step();
}

// ---------- Odds view ----------
function renderOdds() {
  const v = $('#v-odds');
  if (!counts || simsDone < settings.sims) { v.innerHTML = '<div class="empty"><p>Running the simulations…</p></div>'; return; }
  const N = simsDone, tab = buildTable(state.results);
  const real = rankTable(buildTable(state.results), false).map(r => r.id);
  const ids = TEAMS.map(t => t.id);
  const key = {win: id => counts[id].win * 1e6 + counts[id].fin, top8: id => counts[id].top8 * 1e6 - counts[id].pos, pos: id => -counts[id].pos, table: id => -real.indexOf(id)}[oddsSort];
  ids.sort((a, b) => key(b) - key(a));
  const fav = [...TEAMS].sort((a, b) => counts[b.id].win - counts[a.id].win).slice(0, 4);
  const cell = (x, cls = '') => { const p = pct(x, N); return `<td class="heat ${cls}" style="--p:${p.toFixed(1)}">${fmt(p)}</td>`; };
  const rows = ids.map((id, i) => {
    const c = counts[id], r = tab[id];
    return `<tr><td class="team"><span class="pos">${i + 1}</span>${teamCell(id)}</td>
      <td class="full-only">${r.pts}</td><td>${(c.pts / N).toFixed(1)}</td><td class="faint full-only">${(c.pos / N).toFixed(1)}</td>
      ${cell(c.top8)}${cell(c.po)}<td class="faint">${fmt(pct(c.out, N))}</td>
      ${cell(c.r16)}${cell(c.qf)}${cell(c.sf)}${cell(c.fin)}${cell(c.win, 'win')}</tr>`;
  }).join('');
  const sortChip = (k, label) => `<button class="chip" data-sort="${k}" aria-pressed="${oddsSort === k}">${label}</button>`;
  v.innerHTML = `
    <div class="favs">${fav.map(t => `<div class="fav" style="--c:${t.color}"><b>${fmt(pct(counts[t.id].win, N))}%</b><span>${t.name} to win it</span></div>`).join('')}</div>
    <div class="row">${sortChip('win', 'By title odds')}${sortChip('top8', 'By top 8 odds')}${sortChip('pos', 'By predicted finish')}${sortChip('table', 'By current table')}</div>
    <div class="scroll"><table>
      <thead><tr><th class="team">Team</th><th class="full-only">Pts</th><th title="Expected final points">Exp pts</th><th class="full-only" title="Average league finish">Avg pos</th>
      <th title="Finish 1st–8th">Top 8 %</th><th title="Finish 9th–24th">Play-off %</th><th title="Finish 25th–36th">Out %</th>
      <th title="Reach the round of 16">R16 %</th><th title="Reach the quarter-finals">QF %</th><th title="Reach the semi-finals">SF %</th><th title="Reach the final">Final %</th><th>Win %</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <details class="how"><summary>How the odds are worked out</summary>
      <p>Every club has a strength rating built from three things: a baseline for how good the club usually is (for clubs in the top five leagues, half of it comes from their last two domestic seasons), its domestic form this season, and its results in this competition so far. Those results are judged against the opponent, so beating a strong side counts for more than beating a weak one, and early results are held back until more games are played.</p>
      <p>Each remaining match is played out with goals drawn at random from the two teams' expected scoring rates, with a home boost. Then the play-offs, round of 16, quarter-finals, semi-finals and a one-off final are played under the real format, with extra time and penalties. This whole season is repeated ${N.toLocaleString()} times, and the percentages show how often each thing happened.</p>
      <p>Tested on the full 2025/26 seasons of the top five European leagues (1,448 games, predicted one matchday at a time), the model captured about two-thirds of the bookmakers' accuracy advantage over a naive guess, and its percentages were well calibrated. It did not beat the bookmakers' closing prices, so treat big disagreements with the market as a reason to doubt the model.</p>
      <p>To capture surprises, each club's strength wobbles a little in every simulated season. Where you've entered xG, it's blended with the real goals so lucky or unlucky scorelines count for less. Clubs that have nothing left to play for on matchday 8 rest players, and you can switch on a knockout experience boost for clubs with recent finals. You can change how much each factor counts in Update.</p>
    </details>`;
  v.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { oddsSort = b.dataset.sort; renderOdds(); });
}

// ---------- Table view ----------

    <div class="scroll"><table>

}

// ---------- Sim a season view ----------
function renderSeason() {
  const v = $('#v-season');
  if (!lastSeason) {
    v.innerHTML = `<h2>Play out one season</h2><div class="empty"><p>See one possible way the rest of the competition could go, from the league phase to the final.</p><button class="btn" id="simone">Simulate a season</button></div>`;

// Random multi aimed at a target fair price: legs from different matches, mixing market types.
function buildSurprise(all, target) {
  const pool = [];
  for (const x of all) for (const m of x.list) {
    const ok = m.group === 'Correct score' ? m.p >= 0.08 : (m.p >= 0.3 && m.p <= 0.9 && m.group !== 'Head to head' || ['H', 'A'].includes(m.id) && m.p >= 0.4);

  }
  let bestLegs = [], bestGap = Infinity;
  for (let tries = 0; tries < 300; tries++) {
    const used = new Set(), legs = []; let price = 1;
    const order = pool.map(m => [Math.random(), m]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
    for (const m of order) {
      if (used.has(m.f.k) || legs.length >= 6) continue;
      if (m.group === 'Correct score' && legs.some(l => l.group === 'Correct score') && target < 50) continue;
      const next = price / m.p;
      if (next > target * 1.35) continue;
      legs.push(m); used.add(m.f.k); price = next;
      if (price >= target * 0.8) break;
    }
    const gap = Math.abs(Math.log(price / target));
    if (legs.length >= 2 && gap < bestGap) { bestGap = gap; bestLegs = legs; }
  }
  return bestLegs;
}

  };

  const sig = all.map(x => x.f.k).join(',') + '|' + tgt;
  if (!surprises[ctx] || surprises[ctx].sig !== sig) surprises[ctx] = {sig, legs: buildSurprise(all, tgt)};
  return `
      <h3 class="sec">Most likely winners</h3><div class="ideas">${winners.map(card).join('')}</div>
      <h3 class="sec">Goals markets</h3><div class="ideas">${goals.map(card).join('') || '<p class="lede">No goals market is above 55% for these games.</p>'}</div>
      <h3 class="sec">Upset watch</h3><div class="ideas">${upsets.map(card).join('') || '<p class="lede">No outsiders in the 20–36% range for these games.</p>'}</div>
      <h3 class="sec">Correct score long shots</h3><div class="ideas">${scores.map(card).join('')}</div>
      <h3 class="sec">Surprise me</h3>
      <div class="row" role="group" aria-label="Target price">${[3, 10, 25, 100].map(t => `<button class="chip" data-target="${t}" aria-pressed="${t === tgt}">Around ${t}.00</button>`).join('')}</div>
      <div class="ideas">${multiCard(`Surprise me: around ${tgt}.00`, 'A random mix of markets from different matches, aimed at your chosen fair price. Shuffle for another.', surprises[ctx].legs, true)}</div>
      <h3 class="sec">Multi ideas</h3>
      <p class="lede">Ready-made combinations for $1–2 fun bets. The fair price is what the multi should pay if the model is right; Sportsbet will usually pay less, and same game multis are priced differently again.</p>
      <div class="ideas">
        ${multiCard('Safety net', 'Four double chance picks: the side the model favours, or a draw.', safety)}
        ${multiCard('Steady three', 'The three most likely winners.', winners.slice(0, 3))}
        ${multiCard('Both teams to score', 'The three games most likely to see goals at both ends.', btts)}
        ${multiCard('Goals galore', 'The three games most likely to have three or more goals.', overs)}
        ${multiCard('Tight ones', 'The games most likely to stay low scoring.', unders)}
        ${multiCard('Clean sheet kings', 'Favourites to win without conceding.', nil)}
        ${multiCard('Mixed bag', 'One each: a double chance, both teams to score, over 2.5, and a correct score.', mixed)}
        ${multiCard('Same game multi', 'The strongest favourite to win, plus at least two goals in that game. Worked out together, not multiplied.', sgm)}
        ${multiCard('Upset special', 'The best outsider shot, padded with two safe double chances.', upset)}
        ${multiCard('Favourites\' scorelines', 'The most likely winning score for the three strongest favourites, the same idea as a correct score multi on big home wins.', favScores)}
        ${multiCard('Lottery ticket', 'The single most likely score in three games, which is often a 1–1.', scores.slice(0, 3))}
      </div>`;
}
function wireIdeas(v, ctx, rerender) {
  v.querySelectorAll('[data-target]').forEach(b => b.onclick = () => { targets[ctx] = +b.dataset.target; rerender(); });
  v.querySelectorAll('[data-shuffle]').forEach(b => b.onclick = () => { surprises[ctx] = null; rerender(); });
  v.querySelectorAll('[data-leg]').forEach(b => b.onclick = () => { toggleLeg(b.dataset.leg); rerender(); });
  v.querySelectorAll('[data-multi]').forEach(b => b.onclick = () => {
    b.dataset.multi.split(',').forEach(k => { if (!bets.slip.includes(k)) toggleLeg(k); });
    rerender(); toast('Added to your multi. Check the prices in Bet check.');
  });
}
const FOOT = '<p class="footnote">These are the model\'s opinions, not tips. It knows nothing about injuries, team news or line-ups. Gamble only what you\'re happy to lose. For free, confidential support call Gambling Help Online on 1800 858 858.</p>';
function renderIdeas() {
  const v = $('#v-ideas');
  const openMds = [1,2,3,4,5,6,7,8].filter(m => FIX.some(f => f.md === m && !state.results[f.k]));
  if (!openMds.length) { v.innerHTML = '<div class="empty"><p>Every league phase match has a result. Domestic league ideas are in the Leagues tab.</p></div>'; return; }
  if (!openMds.includes(ideasMd)) ideasMd = openMds[0];
  const all = FIX.filter(f => f.md === ideasMd && !state.results[f.k]).map(f => ({f, ...marketsFor(f)}));
  v.innerHTML = `
    <h2>Bet ideas</h2>
    <p class="lede">The model's strongest picks for one matchday, with the fair odds for each. A pick is only worth backing if the bookmaker's price is bigger than the fair odds, so check the real price in Bet check before you bet. Domestic league ideas are in the Leagues tab.</p>
    <div class="mds">${openMds.map(m => `<button class="chip" data-imd="${m}" aria-pressed="${m === ideasMd}">MD${m}</button>`).join('')}</div>
    <div class="betgrid"><div>${ideasBlock(all, 'cl' + ideasMd)}</div><div class="panel slip"></div></div>${FOOT}`;
  v.querySelectorAll('[data-imd]').forEach(b => b.onclick = () => { ideasMd = +b.dataset.imd; renderIdeas(); });
  wireIdeas(v, 'cl' + ideasMd, renderIdeas);
  renderSlip();
}

// ---------- Domestic leagues ----------
let leagueSel = 'E0', lgDraft = null;
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
function upcomingFixtures(lg) {
  const L = (state.leagues || {})[lg]; if (!L) return [];
  const cutoff = new Date(Date.now() - 2 * 864e5).toISOString().slice(0, 10);   // keep games up to two days old until results arrive
  return L.fixtures.filter(r => r[0] >= cutoff).sort((a, b) => a[0].localeCompare(b[0])).map(r => leagueFix(lg, r));
}
// football-data.co.uk CSV: season files (results) and fixtures.csv (upcoming games with odds).
function parseFootballData(text) {
  const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return {};
  const head = lines[0].split(','), col = n => head.indexOf(n);
  const num = (cells, names) => { for (const n of names) { const i = col(n); if (i >= 0 && +cells[i] > 1) return +cells[i]; } return null; };
  const out = {};
  for (const line of lines.slice(1)) {
    const c = line.split(','), lg = c[col('Div')];
    if (!LEAGUE_BASE[lg]) continue;
    const dm = (c[col('Date')] || '').split('/'); if (dm.length !== 3) continue;
    const y = dm[2].length === 2 ? '20' + dm[2] : dm[2], date = `${y}-${dm[1].padStart(2, '0')}-${dm[0].padStart(2, '0')}`;
    const h = leagueTeamName(lg, c[col('HomeTeam')] || ''), a = leagueTeamName(lg, c[col('AwayTeam')] || '');
    if (!h || !a) continue;
    const o = out[lg] = out[lg] || {results: [], fixtures: []};
    const hg = c[col('FTHG')], ag = c[col('FTAG')];
    if (hg !== undefined && hg !== '' && ag !== '') o.results.push([date, h, a, +hg, +ag]);
    else o.fixtures.push([date, h, a, num(c, ['B365H', 'AvgH', 'PSH']), num(c, ['B365D', 'AvgD', 'PSD']), num(c, ['B365A', 'AvgA', 'PSA']), num(c, ['B365>2.5', 'Avg>2.5', 'P>2.5']), num(c, ['B365<2.5', 'Avg<2.5', 'P<2.5'])]);
  }
  return out;
}
// Text copied from Sportsbet's match list: "Frosinone v Sassuolo" then the three prices. Also accepts results like "Napoli 2-1 Venezia".
function parseSportsbetText(text, lg) {
  const known = [...new Set([...Object.keys(LEAGUE_BASE[lg].teams), ...((state.leagues || {})[lg] || {results: []}).results.flatMap(r => [r[1], r[2]])])];
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const now = new Date(); let date = todayISO();
  const fixtures = [], results = [];
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    const dm = l.match(/\b(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\b/i);
    if (dm && !l.includes('|') && !/\sv\s/.test(l)) {
      const mo = MONTHS.findIndex(m => m.toLowerCase() === dm[2].slice(0, 3).toLowerCase());
      let y = now.getFullYear(); if (mo < now.getMonth() - 6) y++; if (mo > now.getMonth() + 6) y--;
      date = `${y}-${String(mo + 1).padStart(2, '0')}-${dm[1].padStart(2, '0')}`; continue;
    }
    if (/^today\b/i.test(l)) { date = todayISO(); continue; }
    const res = l.match(/^(.+?)\s+(\d{1,2})\s*[-–]\s*(\d{1,2})\s+(.+)$/);
    if (res) { results.push([date, leagueTeamName(lg, res[1], known), leagueTeamName(lg, res[4], known), +res[2], +res[3]]); continue; }
    const fx = l.match(/^(.+?)\s+(?:v|vs\.?)\s+(.+)$/i);
    if (fx && !l.includes('|')) {
      const prices = [];
      for (let j = i + 1; j < lines.length && prices.length < 3; j++) {
        if (/^\d+(\.\d+)?$/.test(lines[j])) prices.push(+lines[j]);
        else if (/\s(v|vs\.?)\s/i.test(lines[j])) break;
      }
      fixtures.push([date, leagueTeamName(lg, fx[1], known), leagueTeamName(lg, fx[2], known), prices[0] || null, prices[1] || null, prices[2] || null, null, null]);
    }
  }
  return {fixtures, results};
}
function mergeLeague(base, add, replaceResults) {
  const L = {results: [...(base.results || [])], fixtures: [...(base.fixtures || [])]};
  if (add.results.length) {
    if (replaceResults) L.results = add.results;
    else for (const r of add.results) { const i = L.results.findIndex(x => x[1] === r[1] && x[2] === r[2]); if (i >= 0) L.results[i] = r; else L.results.push(r); }
  }
  for (const f of add.fixtures) {
    const i = L.fixtures.findIndex(x => x[1] === f[1] && x[2] === f[2]);
    if (i >= 0) { const old = L.fixtures[i]; L.fixtures[i] = f.map((v, k) => v ?? old[k]); } else L.fixtures.push(f);
  }
  const played = new Set(L.results.map(r => r[1] + '|' + r[2]));
  L.fixtures = L.fixtures.filter(f => !played.has(f[1] + '|' + f[2]));
  return L;
}
function renderLeagues() {
  const v = $('#v-leagues'), lg = leagueSel, LB = LEAGUE_BASE[lg];
  const L = (state.leagues || {})[lg] || {results: [], fixtures: []};
  const lm = getLeagueModel(lg), fx = upcomingFixtures(lg), canSave = saveMode !== 'readonly';
  const last = L.results.length ? L.results.reduce((m, r) => r[0] > m ? r[0] : m, '') : null;
  const knownTeams = new Set([...Object.keys(LB.teams), ...L.results.flatMap(r => [r[1], r[2]])]);
  const newClubs = [...new Set(fx.flatMap(f => [f.h, f.a]))].filter(t => !knownTeams.has(t));
  const cards = fx.map(f => {
    const g = scoreGrid(f); let H = 0, D = 0, A = 0, O = 0, B = 0, best = [0, 0], bp = 0;
    for (let i = 0; i <= 10; i++) for (let j = 0; j <= 10; j++) { const p = g[i][j]; if (i > j) H += p; else if (i === j) D += p; else A += p; if (i + j > 2) O += p; if (i && j) B += p; if (p > bp) { bp = p; best = [i, j]; } }
    const seg = (cls, x) => `<span class="${cls}" style="width:${(x * 100).toFixed(1)}%">${x >= .12 ? Math.round(x * 100) + '%' : ''}</span>`;
    const [oh, od, oa] = f.odds, has = oh && od && oa;
    const e = (p, o) => o ? p * o - 1 : null;
    const edges = has ? [[f.h, e(H, oh), oh], ['Draw', e(D, od), od], [f.a, e(A, oa), oa]] : [];
    const top = edges.filter(x => x[1] > 0).sort((a, b) => b[1] - a[1])[0];
    return `<div class="match"><div class="h"><span class="tn">${f.h}</span></div><div class="score faint" style="font-size:15px">${shortDate(f.date)}</div><div class="a"><span class="tn">${f.a}</span></div>
      <div class="odds" role="img" aria-label="${f.h} ${Math.round(H * 100)}%, draw ${Math.round(D * 100)}%, ${f.a} ${Math.round(A * 100)}%">${seg('oh', H)}${seg('od', D)}${seg('oa', A)}</div>
      ${has ? `<div class="likely">Sportsbet ${oh.toFixed(2)} / ${od.toFixed(2)} / ${oa.toFixed(2)}. Fair ${fairTxt(H)} / ${fairTxt(D)} / ${fairTxt(A)}${top ? `. <span class="edge-pos">Model edge: ${top[0]} +${Math.round(top[1] * 100)}%</span>` : ''}</div>` : ''}
      <div class="likely">Most likely ${best[0]}–${best[1]}. Both teams score ${Math.round(B * 100)}%. Over 2.5 ${Math.round(O * 100)}%</div>
      <div class="likely" style="margin-top:2px"><button class="add" data-check="${f.k}">All markets in Bet check</button></div></div>`;
  }).join('');
  const all = fx.map(f => ({f, ...marketsFor(f)}));
  const ratings = [...knownTeams].map(t => [t, lm.rating(t)]).sort((a, b) => b[1] - a[1]);
  v.innerHTML = `
    <h2>Domestic leagues</h2>
    <p class="lede">The same model that passed the five-league test, starting from each club's rating at the end of 2025/26 and updating from this season's results as you load them. Promoted clubs start at the level of last season's bottom three.</p>
    <div class="mds">${Object.entries(LEAGUE_BASE).map(([k, x]) => `<button class="chip" data-lg="${k}" aria-pressed="${k === lg}">${x.name}</button>`).join('')}</div>
    <p class="lede">${L.results.length ? `${L.results.length} result${L.results.length === 1 ? '' : 's'} from this season loaded, up to ${shortDate(last)}.` : 'No results from this season loaded yet, so ratings are still last season\'s and promoted clubs are guesses. Load this season\'s results before trusting the edges.'} ${fx.length ? `${fx.length} upcoming games.` : ''} Goals average used: ${lm.g.toFixed(2)}.${newClubs.length ? ` Starting at promoted level: ${newClubs.join(', ')}.` : ''}</p>
    ${fx.length ? `<div class="betgrid"><div>
        <div class="matches" style="grid-template-columns:1fr">${cards}</div>
        ${fx.length >= 2 ? `<h2 style="margin-top:24px">Bet ideas: ${LB.name}</h2>${ideasBlock(all, 'lg' + lg)}` : ''}
      </div><div class="panel slip"></div></div>`
      : `<div class="empty"><p>No upcoming ${LB.name} games loaded.${canSave ? ' Add them below, from Sportsbet or a fixtures file.' : ''}</p></div>`}
    ${canSave ? `<div class="panel" style="margin-top:16px"><h3>Load games and results</h3>
      <p class="help"><b>From Sportsbet:</b> select the ${LB.name} match list on the website (dates, team names and the three prices), copy it, and paste it here. Results can go in too, one per line, like <b>Napoli 2-1 Venezia</b>.</p>
      <textarea id="lgPaste" placeholder="Tomorrow 17 Oct&#10;Frosinone v Sassuolo&#10;Frosinone&#10;2.35&#10;Draw&#10;3.70&#10;Sassuolo&#10;2.80"></textarea>
      <p class="help" style="margin-top:12px"><b>From football-data.co.uk:</b> this season's league files (E0, SP1, I1, D1, F1) bring in every result so far, and fixtures.csv brings in the coming week's games with Bet365 prices. You can pick several files at once; each goes to the right league automatically.</p>
      <input type="file" id="lgFiles" accept=".csv,text/csv" multiple>
      <div class="row" style="margin-top:10px"><button class="btn ghost" id="lgCheck">Check</button><button class="btn" id="lgSave" ${lgDraft && lgDraft.count ? '' : 'disabled'}>Save</button></div>
      ${lgDraft ? `<ul class="preview">${lgDraft.summary.map(s => `<li>${s}</li>`).join('')}</ul>` : ''}
    </div>` : ''}
    <details class="how"><summary>${LB.name} power ratings</summary>
      <div class="scroll" style="margin-top:10px"><table><thead><tr><th class="l">Club</th><th>Rating</th><th>Start of season</th></tr></thead><tbody>
      ${ratings.map(([t, r]) => `<tr><td class="l">${t}</td><td>${Math.round(r)}</td><td class="faint">${LB.teams[t] ?? LB.promo}</td></tr>`).join('')}</tbody></table></div></details>
    ${FOOT}`;
  v.querySelectorAll('[data-lg]').forEach(b => b.onclick = () => { leagueSel = b.dataset.lg; lgDraft = null; renderLeagues(); });
  v.querySelectorAll('[data-check]').forEach(b => b.onclick = () => { checkFix = b.dataset.check; checkMode = 'matches'; showView('check'); });
  if (fx.length >= 2) wireIdeas(v, 'lg' + lg, renderLeagues);
  if (canSave) {
    $('#lgCheck').onclick = async () => {
      const text = $('#lgPaste').value, files = [...$('#lgFiles').files];
      const adds = {};   // lg -> {results, fixtures, fromFile}
      if (text.trim()) adds[lg] = {...parseSportsbetText(text, lg), fromFile: false};
      for (const file of files) {
        const parsed = parseFootballData(await file.text());
        for (const [k, x] of Object.entries(parsed)) {
          const t = adds[k] = adds[k] || {results: [], fixtures: [], fromFile: false};
          t.results.push(...x.results); t.fixtures.push(...x.fixtures); if (x.results.length) t.fromFile = true;
        }
      }
      const summary = []; let count = 0;
      for (const [k, x] of Object.entries(adds)) {
        count += x.results.length + x.fixtures.length;
        summary.push(`${LEAGUE_BASE[k].name}: ${x.results.length} result${x.results.length === 1 ? '' : 's'}, ${x.fixtures.length} upcoming game${x.fixtures.length === 1 ? '' : 's'}${x.fixtures.length ? ` (${x.fixtures.slice(0, 3).map(f => `${f[1]} v ${f[2]}${f[3] ? ` ${f[3]}/${f[4]}/${f[5]}` : ''}`).join('; ')}${x.fixtures.length > 3 ? '…' : ''})` : ''}`);
      }
      if (!count) summary.push('Nothing recognised. For Sportsbet, include the "Team v Team" lines and the prices under them. For files, use football-data.co.uk league or fixtures CSVs.');
      lgDraft = {adds, summary, count};
      const keep = text; renderLeagues(); const ta = $('#lgPaste'); if (ta) ta.value = keep;
    };
    $('#lgSave').onclick = () => {
      const leagues = {...(state.leagues || {})};
      for (const [k, x] of Object.entries(lgDraft.adds)) leagues[k] = mergeLeague(leagues[k] || {}, x, x.fromFile);
      const n = lgDraft.count; lgDraft = null;
      save({...state, leagues}, `Saved ${n} game${n === 1 ? '' : 's'}`);
    };
  }
  renderSlip();
}

// ---------- tabs ----------
function showView(name) {
  document.querySelectorAll('.tab').forEach(t => { const on = t.dataset.view === name; t.setAttribute('aria-selected', on); if (on) t.scrollIntoView({inline:'nearest', block:'nearest'}); });
  document.querySelectorAll('.view').forEach(v => v.hidden = v.id !== 'v-' + name);
  if (name === 'season') renderSeason();
  if (name === 'update') renderUpdate();
  if (name === 'fixtures') renderFixtures();
  if (name === 'ideas') renderIdeas();
  if (name === 'leagues') renderLeagues();
  if (name === 'check') renderCheck();
  window.scrollTo({top: 0});
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => showView(t.dataset.view));

// ---------- start ----------
renderTable(); renderOdds(); runSims();
(async () => {
  if (!(window.claude && window.claude.use)) return;          // hosted elsewhere: save on this device
  try {
    const [art, user, dl] = await Promise.all([window.claude.use('artifact'), window.claude.use('user'), window.claude.use('downloads')]);
    downloadsApi = dl;
    if (art) {
      artifactApi = art;
      let canEdit = true;
      try { if (user) canEdit = await user.canEdit(); } catch (e) {}
      saveMode = canEdit ? 'shared' : 'readonly';
    }
  } catch (e) {}
  if (!document.getElementById('v-update').hidden) renderUpdate();
})();
