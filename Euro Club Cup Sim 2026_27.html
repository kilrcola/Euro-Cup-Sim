<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Euro Club Cup Sim 2026/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --sunk:#E3E9E5; --ink:#14213D; --muted:#5A6577; --line:#D3DCD6;
  --pitch:#1F7A4D; --pitch-ink:#FFFFFF; --gold:#A87F12; --gold-tint:#E9C34A; --amber:#C07613; --red:#B23A3A;
  --zone-top:#1F7A4D; --zone-po:#C9A13B; --zone-out:#A9B3AE;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613; --surface:#15201B; --sunk:#1B2822; --ink:#E4ECE7; --muted:#93A39B; --line:#26352E;
    --pitch:#4DBB82; --pitch-ink:#0B1410; --gold:#E2BC4A; --gold-tint:#E2BC4A; --amber:#E0A04A; --red:#E07272;
    --zone-top:#4DBB82; --zone-po:#D6B04E; --zone-out:#4A5852;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#15201B; --sunk:#1B2822; --ink:#E4ECE7; --muted:#93A39B; --line:#26352E;
  --pitch:#4DBB82; --pitch-ink:#0B1410; --gold:#E2BC4A; --gold-tint:#E2BC4A; --amber:#E0A04A; --red:#E07272;
  --zone-top:#4DBB82; --zone-po:#D6B04E; --zone-out:#4A5852;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font:16px/1.5 Barlow, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; -webkit-text-size-adjust:100%}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg)}
button,select,input,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--pitch); outline-offset:2px}
.wrap{max-width:1120px; margin:0 auto; padding:0 16px}
.cond{font-family:"Barlow Condensed", "Arial Narrow", Barlow, sans-serif}

header.top{padding:22px 0 10px}
header.top h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:clamp(30px,6vw,46px); line-height:1; margin:0; letter-spacing:-.01em}
header.top h1 small{font-weight:500; color:var(--muted); font-size:.55em; margin-left:.35em; letter-spacing:0}
.status{color:var(--muted); margin:6px 0 0; font-size:15px; min-height:1.5em}
.progress{height:3px; background:var(--sunk); border-radius:2px; overflow:hidden; margin-top:10px}
.progress i{display:block; height:100%; width:0; background:var(--pitch); transition:width .15s linear}

nav.tabs{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding:8px 0; border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
.tab{border:0; background:none; padding:8px 14px; border-radius:999px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink); color:var(--bg)}

main{padding:18px 0 48px}
.view[hidden]{display:none}
h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:600; font-size:26px; line-height:1.15; margin:0 0 4px}
.lede{color:var(--muted); margin:0 0 14px; max-width:68ch}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 12px}
.chip{white-space:nowrap; flex:none; border:1px solid var(--line); background:var(--surface); padding:5px 12px; border-radius:999px; cursor:pointer; font-size:14px; font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--ink); background:var(--ink); color:var(--bg)}
.btn{border:0; background:var(--pitch); color:var(--pitch-ink); padding:10px 18px; border-radius:10px; font-weight:600; cursor:pointer}
.btn.ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line)}
.btn:disabled{opacity:.5; cursor:default}

/* favourites strip */
.favs{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:0 0 18px}
.fav{background:var(--surface); border-radius:12px; padding:12px 14px; border-left:4px solid var(--c)}
.fav b{display:block; font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-size:32px; line-height:1; font-weight:700}
.fav span{color:var(--muted); font-size:14px}

/* tables */
.scroll{overflow-x:auto; background:var(--surface); border-radius:12px; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums}
th,td{padding:8px 10px; text-align:right; white-space:nowrap}
th{font-weight:600; color:var(--muted); font-size:13px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface)}
td{border-bottom:1px solid var(--line); font-size:15px}
tr:last-child td{border-bottom:0}
th.l,td.l{text-align:left}
td.team, th.team{position:sticky; left:0; background:var(--surface); z-index:1; text-align:left}
th.team{z-index:2}
.tn{display:inline-flex; align-items:center; gap:8px; font-weight:600}
.dot{width:10px; height:10px; border-radius:3px; background:var(--c); flex:none}
.pos{color:var(--muted); width:2.2em; display:inline-block}
td.heat{background:color-mix(in srgb, var(--pitch) calc(var(--p) * 0.62%), transparent)}
td.heat.win{background:color-mix(in srgb, var(--gold-tint) calc(var(--p) * 1.6%), transparent); font-weight:600}
td.faint{color:var(--muted)}
.zone td.team{box-shadow:inset 4px 0 0 var(--z)}
.full-only{display:none}
@media (min-width:760px){ .full-only{display:table-cell} }
.pill{display:inline-block; width:20px; height:20px; line-height:20px; text-align:center; border-radius:5px; font-size:12px; font-weight:600; margin-left:2px; color:#fff}
.pill.W{background:#2E8B57} .pill.D{background:#8A949B} .pill.L{background:#B5473F}
.legend{display:flex; gap:16px; flex-wrap:wrap; color:var(--muted); font-size:14px; margin:10px 2px 0}
.legend i{display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; background:var(--z)}

/* fixtures */
.mds{display:flex; gap:4px; overflow-x:auto; margin:0 0 12px; scrollbar-width:none}
.mds::-webkit-scrollbar{display:none}
.mds .chip{min-width:44px; text-align:center}
.matches{display:grid; gap:8px; grid-template-columns:1fr}
@media (min-width:760px){ .matches{grid-template-columns:1fr 1fr} }
.match{background:var(--surface); border-radius:12px; padding:10px 12px; display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center}
.match .h{justify-self:end; text-align:right} .match .a{justify-self:start}
.match .tn{font-weight:600}
.score{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-size:24px; font-weight:700; min-width:64px; text-align:center}
.odds{grid-column:1/-1; display:flex; height:22px; border-radius:6px; overflow:hidden; font-size:12px; font-weight:600}
.odds span{display:flex; align-items:center; justify-content:center; min-width:0; overflow:hidden}
.odds .oh{background:var(--pitch); color:var(--pitch-ink)} .odds .od{background:var(--sunk); color:var(--muted)} .odds .oa{background:var(--ink); color:var(--bg)}
.likely{grid-column:1/-1; color:var(--muted); font-size:13px; text-align:center; margin-top:-4px}

/* bracket */
.rounds-tabs{display:flex; gap:4px; overflow-x:auto; margin-bottom:12px}
.bracket{display:block}
.round{display:none}
.round.on{display:grid; gap:8px}
@media (min-width:1000px){
  .rounds-tabs{display:none}
  .bracket{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:12px; align-items:start}
  .round{display:grid !important; gap:8px; align-content:space-around; min-height:100%}
  .round h3{display:block}
}
.round h3{display:none; font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-size:18px; font-weight:600; margin:0 0 2px; color:var(--muted)}
.tie{background:var(--surface); border-radius:10px; padding:8px 10px; font-size:14px}
.tie .ln{display:flex; justify-content:space-between; gap:8px; align-items:center}
.tie .ln.w{font-weight:700}
.tie .ln.lose{color:var(--muted)}
.tie .note{color:var(--muted); font-size:12px}
.champion{background:var(--surface); border-radius:12px; padding:16px; margin:0 0 16px; border-left:6px solid var(--c); display:flex; gap:14px; align-items:baseline; flex-wrap:wrap}
.champion b{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-size:36px; line-height:1}
.champion span{color:var(--muted)}
.empty{background:var(--surface); border-radius:12px; padding:28px 20px; text-align:center}
.empty p{color:var(--muted); margin:0 0 14px}

/* update */
.panel{background:var(--surface); border-radius:12px; padding:16px; margin:0 0 16px}
.panel h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-size:21px; font-weight:600; margin:0 0 4px}
.panel p.help{color:var(--muted); margin:0 0 12px; font-size:15px; max-width:68ch}
textarea{width:100%; min-height:140px; border:1px solid var(--line); border-radius:10px; background:var(--bg); padding:10px; resize:vertical; font-size:15px}
.preview{list-style:none; padding:0; margin:12px 0; display:grid; gap:4px; font-size:14px}
.preview li{padding:6px 10px; border-radius:8px; background:var(--bg)}
.preview li.bad{color:var(--red)}
.preview li .md{color:var(--muted); margin-right:6px}
.forms{display:grid; gap:6px; grid-template-columns:1fr}
@media (min-width:860px){ .forms{grid-template-columns:1fr 1fr} }
.frow{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:4px 0; border-bottom:1px solid var(--line)}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; flex:none}
.seg button{border:0; background:none; padding:5px 8px; font-size:13px; cursor:pointer; color:var(--muted); min-width:44px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg); font-weight:600}
.sl{display:grid; grid-template-columns:1fr; gap:4px; margin:0 0 14px}
.sl label{display:flex; justify-content:space-between; font-weight:500}
.sl label output{color:var(--muted); font-variant-numeric:tabular-nums}
.sl small{color:var(--muted)}
input[type=range]{width:100%; accent-color:var(--pitch)}
select{border:1px solid var(--line); border-radius:8px; background:var(--bg); padding:6px 10px}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-weight:500; z-index:20; max-width:90vw}
details.how{background:var(--surface); border-radius:12px; padding:12px 16px; margin-top:16px}
details.how summary{cursor:pointer; font-weight:600}
details.how p{color:var(--muted); max-width:70ch; margin:8px 0 0}
.strength{color:var(--muted); font-size:13px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>

<script>

].map(([id,name,short,color,r]) => ({id,name,short,color,r}));
const TEAM = Object.fromEntries(TEAMS.map(t => [t.id, t]));

// ---------- Fixtures, matchday by matchday (home first) ----------
const MDS = [
  'AEK-LAS BRU-AVL BVB-VIL POR-MCI LIL-BET RMA-INT BAR-FEY STU-VIK LIV-ATM PSG-SLO SCP-GAL NAP-ARS FEN-ROM PSV-SHA COM-RBL BAY-BOD MUN-SAB SLA-RCL',
  'RCL-SCP SAB-SLA ARS-LIL ATM-MUN INT-BRU GAL-BAR RBL-PSV VIK-BAY VIL-NAP FEY-COM LAS-LIV ROM-RMA AVL-FEN SHA-AEK BOD-BVB MCI-PSG BET-POR SLO-STU',
  'FEN-SLA SAB-BVB ROM-SLO POR-PSV LIV-VIL MCI-AEK PSG-BAR NAP-BOD STU-ATM COM-MUN LIL-GAL AVL-VIK BRU-RCL BAY-ARS INT-SHA RMA-RBL BET-FEY SCP-LAS',
  'SHA-SCP GAL-STU ATM-BAY BAR-AVL FEY-INT BOD-LIL LAS-SLO MUN-ROM VIL-PSG AEK-RMA FEN-LIV BVB-BET POR-NAP PSV-BRU RBL-MCI RCL-COM SLA-ARS VIK-SAB',
  'BOD-LAS GAL-AVL ARS-BVB COM-AEK FEY-POR MCI-NAP RBL-RCL RMA-PSV SLO-BET SAB-BAR SLA-VIL ATM-VIK BRU-LIV INT-STU SHA-FEN LIL-BAY PSG-ROM SCP-MUN',
  'VIK-FEY VIL-SAB AEK-GAL ROM-SCP AVL-PSG BAR-MCI BAY-SLA MUN-RBL NAP-BRU BET-COM SLO-SHA ARS-RMA BVB-INT LAS-FEN LIV-POR RCL-BOD PSV-ATM STU-LIL',
  'BOD-ATM GAL-FEY AEK-ROM AVL-BVB INT-LIV POR-SLA LIL-SLO RMA-LAS STU-BRU FEN-VIL SAB-NAP COM-PSG MUN-BAY RBL-SHA RCL-MCI BET-ARS SCP-BAR VIK-PSV',
  'ARS-SAB ROM-LIL ATM-FEN BVB-AEK BRU-BOD BAY-BET BAR-COM SHA-RMA FEY-RBL LAS-POR LIV-RCL MCI-SCP PSG-GAL PSV-STU SLA-AVL NAP-VIK VIL-MUN SLO-INT',
];
const FIX = [];
MDS.forEach((line, i) => line.split(' ').forEach(p => {
  const [h, a] = p.split('-');
  FIX.push({md: i + 1, h, a, k: `${i + 1}-${h}-${a}`});
}));

// ---------- Team-name matching for pasted results ----------
const ALIASES = {
  ARS:'arsenal', AVL:'astonvilla villa', ATM:'atleticodemadrid atleticomadrid atleti atletico',
  BAR:'barcelona barca fcbarcelona', BAY:'bayernmunchen bayernmunich bayern fcbayern fcbayernmunchen',
  BVB:'borussiadortmund dortmund bdortmund bvb', BOD:'bodoglimt bodo', BRU:'clubbrugge brugge',
  COM:'como como1907', FEN:'fenerbahce', FEY:'feyenoord', GAL:'galatasaray',
  INT:'inter intermilan internazionale', LAS:'lask lasklinz', LIL:'lille losclille', LIV:'liverpool',
  MCI:'manchestercity mancity', MUN:'manchesterunited manutd manunited manchesterutd',
  NAP:'napoli sscnapoli', PSG:'parissaintgermain paris psg parissg', PSV:'psveindhoven psv',
  RBL:'rbleipzig leipzig', RCL:'lens rclens', BET:'realbetis betis', RMA:'realmadrid',

  SLO:'slovanbratislava slovan sbratislava', STU:'stuttgart vfbstuttgart', VIK:'viking vikingfk',
  VIL:'villarreal', AEK:'aekathens aek paeaek', POR:'porto fcporto',
};
const ALIAS = {};
for (const [id, s] of Object.entries(ALIASES)) s.split(' ').forEach(a => ALIAS[a] = id);
function norm(s) {
  return s.toLowerCase().replace(/ø/g,'o').replace(/æ/g,'ae').replace(/ß/g,'ss')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
}
function findTeam(s) { return ALIAS[norm(s)] || null; }

function parseResults(text, results) {
  const out = [];
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    const m = line.match(/^(.+?)\s+(\d{1,2})\s*[-–—:]\s*(\d{1,2})\s+(.+?)$/);
    if (!m) { out.push({line, ok:false, why:'No score found. Use the form "Liverpool 2-1 Villarreal".'}); continue; }
    const h = findTeam(m[1]), a = findTeam(m[4]);
    if (!h || !a) { out.push({line, ok:false, why:`Team not recognised: ${!h ? m[1] : m[4]}`}); continue; }
    const f = FIX.find(x => x.h === h && x.a === a);
    if (!f) {
      const rev = FIX.find(x => x.h === a && x.a === h);
      out.push({line, ok:false, why: rev ? `In the fixture list this is ${TEAM[a].name} at home. Check the order.` : 'These teams do not play each other.'});
      continue;
    }
    const prev = results[f.k];
    out.push({line, ok:true, f, hg:+m[2], ag:+m[3], prev});
  }
  return out;
}

// ---------- Model ----------
const G = 2.95;          // average goals per game in this competition
const C = 0.19;          // goal-ratio sensitivity per 100 strength points
const GOAL_PTS = 100 / (G * C); // strength points worth one goal of supremacy

    <h2 style="margin-top:22px">Final league table in this run</h2>
    <div class="scroll"><table><thead><tr><th class="team">Team</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr></thead>
    <tbody>${s.rows.map((r, i) => `<tr class="zone" style="--z:${i < 8 ? 'var(--zone-top)' : i < 24 ? 'var(--zone-po)' : 'var(--zone-out)'}"><td class="team"><span class="pos">${i + 1}</span>${teamCell(r.id)}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf - r.ga > 0 ? '+' : ''}${r.gf - r.ga}</td><td><b>${r.pts}</b></td></tr>`).join('')}</tbody></table></div>`;
  $('#simone').onclick = simOne;
  v.querySelectorAll('[data-rt]').forEach(b => b.onclick = () => { roundTab = +b.dataset.rt; renderSeason(); });
}
function simOne() {
  const S = strengths || computeStrengths(state, settings).s;
  lastSeason = simSeason(S, buildTable(state.results), FIX.filter(f => !state.results[f.k]), settings, true);
  renderSeason();
}

// ---------- Update view ----------
function renderUpdate() {
  const v = $('#v-update');
  formDraft = formDraft || {...state.form};
  const canSave = saveMode !== 'readonly';
  const modeNote = saveMode === 'shared' ? 'Saving updates this page for everyone who has the link.'
    : saveMode === 'readonly' ? 'Only the owner can save results and form. You can still change the model settings below.'
    : 'Saving keeps your updates on this device and browser.';
  const S = computeStrengths(state, settings);
  v.innerHTML = `
    <h2>Update</h2><p class="lede">${modeNote}${state.updated ? ` Last saved ${new Date(state.updated).toLocaleString()}.` : ''}</p>
    ${canSave ? `
    <div class="panel"><h3>Add results</h3>
      <p class="help">Paste one result per line, home team first, like <b>Liverpool 2-1 Villarreal</b>. Copying the results list from a matchday round-up usually works as it is. A result you paste again replaces the old one.</p>
      <textarea id="paste" placeholder="Fenerbahçe 1-0 Slavia Praha&#10;Paris Saint-Germain 2-2 Barcelona"></textarea>
      <div class="row" style="margin-top:10px"><button class="btn ghost" id="check">Check results</button><button class="btn" id="saveRes" ${pending && pending.some(p => p.ok) ? '' : 'disabled'}>Save results</button></div>
      ${pending ? `<ul class="preview">${pending.map(p => p.ok
        ? `<li><span class="md">MD${p.f.md}</span>${TEAM[p.f.h].name} ${p.hg}–${p.ag} ${TEAM[p.f.a].name}${p.prev ? ` <span class="md">(replaces ${p.prev[0]}–${p.prev[1]})</span>` : ''}</li>`
        : `<li class="bad">${p.line.replace(/</g, '&lt;')}: ${p.why}</li>`).join('')}</ul>` : ''}
    </div>
    <div class="panel"><h3>Domestic form</h3>
      <p class="help">How each club is doing in its own league compared with its usual level. Each step moves its strength by ${FORM_STEP} points. A club winning its league as expected is Normal; a big club stuck mid-table is Below or Poor.</p>
      <div class="forms">${TEAMS.map(t => `<div class="frow"><span>${teamCell(t.id)} <span class="strength">${Math.round(S.s[t.id])}</span></span>
        <span class="seg" role="group" aria-label="${t.name} form">${FORM_LABELS.map(([val, lab]) => `<button data-team="${t.id}" data-val="${val}" aria-pressed="${(formDraft[t.id] || 0) === +val}">${lab}</button>`).join('')}</span></div>`).join('')}</div>
      <div class="row" style="margin-top:12px"><button class="btn" id="saveForm">Save form</button><span class="strength">The number by each club is its current overall strength.</span></div>
    </div>` : ''}
    <div class="panel"><h3>Model settings</h3>
      <p class="help">These only change the odds on this device. Re-run to see the effect.</p>
      ${slider('clW', 'Weight of results in this competition', 0, 2, 0.1, x => x.toFixed(1) + '×', 'Zero ignores them; 2 trusts them twice as much.')}
      ${slider('formW', 'Weight of domestic form', 0, 2, 0.1, x => x.toFixed(1) + '×', '')}
      ${slider('hfa', 'Home advantage', 0, 120, 5, x => x + ' pts', 'About 55 matches typical European home edges.')}
      ${slider('noise', 'Surprise factor', 0, 100, 5, x => x + ' pts', 'How much a club\'s true level can differ from its rating in any one season.')}
      <div class="sl"><label for="sims">Seasons to simulate</label>
        <select id="sims">${[2000, 10000, 25000, 50000].map(n => `<option value="${n}" ${settings.sims === n ? 'selected' : ''}>${n.toLocaleString()}</option>`).join('')}</select></div>
      <div class="row"><button class="btn" id="rerun">Re-run simulations</button><button class="btn ghost" id="resetSet">Reset settings</button>
      ${saveMode === 'local' && embedded.updated !== state.updated ? '<button class="btn ghost" id="resetData">Go back to built-in results</button>' : ''}</div>
    </div>`;
  v.querySelectorAll('input[type=range]').forEach(r => r.oninput = () => { settings[r.id] = +r.value; r.closest('.sl').querySelector('output').textContent = r.dataset.f ? SLFMT[r.id](+r.value) : r.value; });
  $('#sims').onchange = e => settings.sims = +e.target.value;
  $('#rerun').onclick = () => { saveSettings(); runSims(); toast('Re-running with new settings'); showView('odds'); };
  $('#resetSet').onclick = () => { settings = {...DEFAULT_SET}; saveSettings(); renderUpdate(); runSims(); };
  const rd = $('#resetData'); if (rd) rd.onclick = () => { try { localStorage.removeItem(LS_STATE); } catch (e) {} state = embedded; formDraft = null; afterChange(); };
  if (!canSave) return;
  $('#check').onclick = () => { pending = parseResults($('#paste').value, state.results); const keep = $('#paste').value; renderUpdate(); $('#paste').value = keep; };
  $('#saveRes').onclick = () => {
    const results = {...state.results};
    pending.filter(p => p.ok).forEach(p => results[p.f.k] = [p.hg, p.ag]);
    const n = pending.filter(p => p.ok).length; pending = null;
    save({...state, results}, `${n} result${n === 1 ? '' : 's'} saved`);
  };
  v.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
    formDraft[b.dataset.team] = +b.dataset.val;
    b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  });
  $('#saveForm').onclick = () => { const form = {}; for (const k in formDraft) if (formDraft[k]) form[k] = formDraft[k]; save({...state, form}, 'Form saved'); };
}
const SLFMT = {};
function slider(id, label, min, max, step, f, help) {
  SLFMT[id] = f;
  return `<div class="sl"><label for="${id}">${label}<output>${f(settings[id])}</output></label>
    <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${settings[id]}" data-f="1">${help ? `<small>${help}</small>` : ''}</div>`;
}
function saveSettings() { try { localStorage.setItem(LS_SET, JSON.stringify(settings)); } catch (e) {} }

// ---------- saving ----------
async function save(next, msg) {
  next.updated = new Date().toISOString();
  if (saveMode === 'shared' && artifactApi) {
    const json = JSON.stringify(next).replace(/</g, '\\u003c');
    const html = TEMPLATE.replace(/(<script id="saved-state" type="application\/json">)[\s\S]*?(<\/script>)/, (m, a, b) => a + json + b);
    try { await artifactApi.publish(html); toast(msg + '. Updating the page…'); return; }
    catch (e) {
      if (e && (e.code === 'not_writer' || e.code === 'not_granted')) { saveMode = 'readonly'; renderUpdate(); toast('Only the owner can save to this page'); return; }
      if (e && e.code === 'conflict') return;
      toast('Could not update the page, so this was saved on this device instead');
    }
  }
  try { localStorage.setItem(LS_STATE, JSON.stringify(next)); } catch (e) {}
  state = next; formDraft = null; toast(msg); afterChange();
}
function afterChange() { lastSeason = null; fixMd = null; renderTable(); renderUpdate(); runSims(); }

// ---------- tabs ----------
function showView(name) {
  document.querySelectorAll('.tab').forEach(t => { const on = t.dataset.view === name; t.setAttribute('aria-selected', on); if (on) t.scrollIntoView({inline:'nearest', block:'nearest'}); });
  document.querySelectorAll('.view').forEach(v => v.hidden = v.id !== 'v-' + name);
  if (name === 'season') renderSeason();
  if (name === 'update') renderUpdate();
  if (name === 'fixtures') renderFixtures();
  window.scrollTo({top: 0});
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => showView(t.dataset.view));

// ---------- start ----------
renderTable(); renderOdds(); runSims();
(async () => {
  if (!(window.claude && window.claude.use)) return;          // hosted elsewhere: save on this device
  try {
    const [art, user] = await Promise.all([window.claude.use('artifact'), window.claude.use('user')]);
    if (art) {
      artifactApi = art;
      let canEdit = true;
      try { if (user) canEdit = await user.canEdit(); } catch (e) {}
      saveMode = canEdit ? 'shared' : 'readonly';
    }
  } catch (e) {}
  if (!document.getElementById('v-update').hidden) renderUpdate();
})();

</script>
</body>
</html>
